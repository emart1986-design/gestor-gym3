<style>
  .material-symbols-outlined {
    font-variation-settings: 'FILL' 0, 'wght' 500, 'GRAD' 0, 'opsz' 24;
    display: inline-block;
    line-height: 1;
    text-transform: none;
    letter-spacing: normal;
    word-wrap: normal;
    white-space: nowrap;
    direction: ltr;
    vertical-align: middle;
  }
  @keyframes pulse-subtle {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.65; transform: scale(0.98); }
  }
  .animate-pulse-subtle { animation: pulse-subtle 1.8s ease-in-out infinite; }
  .pr-glow-active {
    box-shadow: 0px 0px 20px rgba(195, 244, 0, 0.15);
    border-left: 3px solid #c3f400;
  }
  .bar-sleeve { background: linear-gradient(180deg, #58586c 0%, #2f2f3d 50%, #1a1a24 100%); }
  .bar-collar { background: linear-gradient(180deg, #87879b 0%, #4a4a5a 50%, #232330 100%); }
  body { min-height: max(884px, 100dvh); background-color: #131319; color: #e4e1ea; }
  [hidden] { display: none !important; }
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 200; display: flex; align-items: flex-end; justify-content: center; }
  .modal-sheet { background: #1f1f25; border-radius: 1rem 1rem 0 0; padding: 1.5rem; padding-bottom: calc(1.5rem + env(safe-area-inset-bottom)); width: 100%; max-width: 32rem; }
  .toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(20px); background: #c3f400; color: #283500; font-weight: 700; padding: 0.6rem 1.1rem; border-radius: 0.75rem; z-index: 300; opacity: 0; pointer-events: none; transition: opacity .2s ease, transform .2s ease; font-family: 'Space Grotesk', sans-serif; box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body class="bg-background text-on-background min-h-screen selection:bg-primary-container selection:text-on-primary font-body-md text-body-md antialiased pb-28">

<header class="bg-surface-container sticky top-0 z-40 w-full shadow-md">
  <div class="flex justify-between items-center w-full px-container-padding-mobile h-tap-comfortable max-w-lg mx-auto">
    <div class="flex items-center gap-space-xs">
      <span class="material-symbols-outlined text-primary-container text-[24px]">fitness_center</span>
      <span class="text-headline-md font-headline-md font-bold tracking-tight text-primary-container">THE BEAST</span>
    </div>
    <div class="flex items-center gap-space-xs" id="header-actions"></div>
  </div>
</header>

<main class="max-w-lg mx-auto px-container-padding-mobile pt-space-md">

  <!-- VISTA: ENTRENAR -->
  <section id="view-entrenar" hidden></section>

  <!-- VISTA: RUTINA -->
  <section id="view-rutina" hidden class="pb-space-3xl flex flex-col gap-space-md"></section>

  <!-- VISTA: PROGRESO -->
  <section id="view-progreso" hidden class="flex flex-col gap-space-lg pb-space-3xl -mx-container-padding-mobile px-container-padding-mobile"></section>

  <!-- VISTA: CALCULADORA -->
  <section id="view-calculadora" hidden class="flex flex-col gap-space-md pb-space-3xl"></section>

</main>

<!-- OVERLAY: CRONOMETRO DE DESCANSO -->
<section id="view-rest" hidden class="fixed inset-0 z-[100] bg-surface-container-lowest overflow-y-auto"></section>

<!-- MODAL GENERICO -->
<div id="modal-overlay" class="modal-overlay" hidden>
  <div class="modal-sheet" id="modal-sheet"></div>
</div>

<div class="toast" id="toast"></div>

<nav id="bottom-nav" class="bg-surface-container-high fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-container-padding-mobile py-space-xs max-w-lg mx-auto shadow-[0px_-4px_16px_rgba(0,0,0,0.6)]">
  <button data-view="entrenar" class="nav-btn flex flex-col items-center justify-center px-space-sm py-space-xs active:scale-[0.98] transition-all duration-100 ease-out rounded-xl">
    <span class="material-symbols-outlined text-[24px]" data-icon="timer">timer</span>
    <span class="font-label-caps text-label-caps">Entrenar</span>
  </button>
  <button data-view="rutina" class="nav-btn flex flex-col items-center justify-center px-space-sm py-space-xs active:scale-[0.98] transition-all duration-100 ease-out rounded-xl">
    <span class="material-symbols-outlined text-[24px]" data-icon="format_list_numbered">format_list_numbered</span>
    <span class="font-label-caps text-label-caps">Rutina</span>
  </button>
  <button data-view="progreso" class="nav-btn flex flex-col items-center justify-center px-space-sm py-space-xs active:scale-[0.98] transition-all duration-100 ease-out rounded-xl">
    <span class="material-symbols-outlined text-[24px]" data-icon="monitoring">monitoring</span>
    <span class="font-label-caps text-label-caps">Progreso</span>
  </button>
  <button data-view="calculadora" class="nav-btn flex flex-col items-center justify-center px-space-sm py-space-xs active:scale-[0.98] transition-all duration-100 ease-out rounded-xl">
    <span class="material-symbols-outlined text-[24px]" data-icon="calculate">calculate</span>
    <span class="font-label-caps text-label-caps">Calculadora</span>
  </button>
</nav>

<script src="app.js"></script>
</body>
</html>
