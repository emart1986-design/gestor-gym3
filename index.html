<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1B3A6B">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Gestor Gym">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect fill='%231B3A6B' width='192' height='192'/><text x='50%' y='50%' font-size='100' fill='white' text-anchor='middle' dy='.3em'>💰</text></svg>">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect fill='%231B3A6B' width='192' height='192'/><text x='50%' y='50%' font-size='100' fill='white' text-anchor='middle' dy='.3em'>💰</text></svg>">
  <title>Gestor de Gym</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; width: 100%; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; color: #1f2937; }
    .container { padding: 1rem; max-width: 100%; background: #f5f5f5; min-height: 100vh; }
    .header { background: linear-gradient(135deg, #1B3A6B 0%, #0F2847 100%); padding: 1.5rem; border-radius: 12px; color: white; margin-bottom: 1.5rem; }
    .header h1 { margin: 0; font-size: 24px; font-weight: 500; }
    .header p { margin: 8px 0 0; font-size: 14px; opacity: 0.9; }
    .mes-selector { background: white; border-radius: 12px; border: 0.5px solid #e5e7eb; padding: 1.5rem; margin-bottom: 1.5rem; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .mes-selector button { padding: 8px 12px; background: white; border: 0.5px solid #d1d5db; border-radius: 6px; font-size: 13px; cursor: pointer; color: #1B3A6B; font-weight: 500; }
    .mes-selector select { flex: 1; min-width: 200px; padding: 12px; border: 0.5px solid #d1d5db; border-radius: 6px; font-size: 16px; font-weight: 600; background: white; color: #1B3A6B; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 2rem; }
    .stat-card { background: white; border: 0.5px solid #e5e7eb; border-radius: 8px; padding: 1rem; text-align: center; }
    .stat-card p { margin: 0; font-size: 12px; }
    .stat-label { color: #6b7280; }
    .stat-value { margin: 8px 0 0; font-size: 28px; font-weight: 600; }
    .stat-total { color: #1B3A6B; }
    .stat-pagaron { color: #059669; }
    .stat-nopagan { color: #dc2626; }
    .grafico { background: white; border: 0.5px solid #e5e7eb; border-radius: 12px; padding: 1.5rem; margin-bottom: 2rem; }
    .grafico-titulo { margin: 0 0 1rem; font-size: 14px; font-weight: 600; color: #1B3A6B; }
    .grafico-container { height: 200px; display: flex; align-items: flex-end; gap: 12px; border-bottom: 0.5px solid #e5e7eb; padding-bottom: 1rem; }
    .grafico-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .grafico-barra { width: 100%; background: #1B3A6B; border-radius: 4px 4px 0 0; min-height: 20px; }
    .grafico-label { font-size: 12px; color: #6b7280; font-weight: 500; }
    .grafico-valor { font-size: 11px; color: #6b7280; }
    .horarios { background: white; border-radius: 12px; border: 0.5px solid #e5e7eb; overflow: hidden; margin-bottom: 1.5rem; }
    .horario-header { background: #1B3A6B; color: white; padding: 1rem; font-size: 15px; font-weight: 600; }
    .horario-content { padding: 1rem; background: white; }
    .alumno-fila { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 0.5px solid #e5e7eb; }
    .alumno-fila:last-child { border-bottom: none; }
    .alumno-nombre { font-weight: 700; font-size: 17px; color: #000000; flex: 1; cursor: pointer; user-select: none; }
    .alumno-estado { padding: 6px 12px; border-radius: 4px; font-size: 12px; font-weight: 600; white-space: nowrap; }
    .estado-pagado { background: #d1fae5; color: #059669; }
    .estado-nopagado { background: #fee2e2; color: #dc2626; }
    .btn-delete { margin-left: 12px; background: transparent; border: none; color: #dc2626; cursor: pointer; font-size: 14px; padding: 4px 8px; font-weight: 700; }
    .btn-agregar { width: 100%; padding: 12px 16px; background: white; border: 0.5px solid #1B3A6B; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; color: #1B3A6B; }
    .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; }
    .modal-content { background: white; border-radius: 12px; padding: 2rem; max-width: 400px; width: 90%; box-shadow: 0 8px 24px rgba(0,0,0,0.15); }
    .modal h2 { margin: 0 0 1.5rem; font-size: 18px; color: #1B3A6B; }
    .form-group { margin-bottom: 1rem; }
    .form-label { display: block; font-size: 13px; color: #6b7280; margin-bottom: 6px; }
    .form-input, .form-select { width: 100%; padding: 8px 12px; border: 0.5px solid #d1d5db; border-radius: 6px; font-size: 14px; box-sizing: border-box; }
    .modal-buttons { display: flex; gap: 8px; }
    .btn-modal { flex: 1; padding: 10px; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; border: 0.5px solid #d1d5db; background: white; color: #1f2937; }
    .btn-modal.guardar { background: #1B3A6B; color: white; border-color: #1B3A6B; }
    .sin-alumnos { margin: 0; font-size: 13px; color: #9ca3af; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>💰 Gestor de Gym</h1>
      <p>Historial de pagos - Sistema inteligente</p>
    </div>

    <div class="mes-selector">
      <button id="btn-mes-ant">← Anterior</button>
      <select id="select-mes">
        <option value="2026-08">Agosto 2026</option>
        <option value="2026-09">Septiembre 2026</option>
        <option value="2026-10">Octubre 2026</option>
        <option value="2026-11">Noviembre 2026</option>
        <option value="2026-12">Diciembre 2026</option>
      </select>
      <button id="btn-mes-sig">Siguiente →</button>
    </div>

    <div class="stats">
      <div class="stat-card">
        <p class="stat-label">Total mes</p>
        <p class="stat-value stat-total" id="total-mes">$87.100</p>
      </div>
      <div class="stat-card">
        <p class="stat-label">Pagaron</p>
        <p class="stat-value stat-pagaron" id="pagaron-mes">30</p>
      </div>
      <div class="stat-card">
        <p class="stat-label">No pagan</p>
        <p class="stat-value stat-nopagan" id="no-pagan-mes">8</p>
      </div>
    </div>

    <div class="grafico">
      <p class="grafico-titulo">Comparativa de ingresos últimos meses</p>
      <div class="grafico-container" id="grafico-container"></div>
    </div>

    <div class="horarios" id="horarios-container"></div>

    <button class="btn-agregar" id="btn-agregar">+ Agregar alumno</button>
  </div>

  <div class="modal" id="modal-agregar">
    <div class="modal-content">
      <h2>Agregar alumno</h2>
      <div class="form-group">
        <label class="form-label">Nombre</label>
        <input type="text" class="form-input" id="input-nombre" placeholder="Nombre del alumno">
      </div>
      <div class="form-group">
        <label class="form-label">Horario</label>
        <select class="form-select" id="select-horario">
          <option value="19-20">19 a 20</option>
          <option value="10-11">10 a 11</option>
          <option value="20-21">20 a 21</option>
          <option value="21-22">21 a 22</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Monto ($)</label>
        <input type="number" class="form-input" id="input-monto" value="2000" placeholder="2000">
      </div>
      <div class="modal-buttons">
        <button class="btn-modal" id="btn-cancelar">Cancelar</button>
        <button class="btn-modal guardar" id="btn-guardar">Guardar</button>
      </div>
    </div>
  </div>

  <script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('service-worker.js');
}

const horarios = ["19-20", "10-11", "20-21", "21-22"];
const etiquetas = { "19-20": "🕐 19 a 20", "10-11": "🕐 10 a 11", "20-21": "🕐 20 a 21", "21-22": "🕐 21 a 22" };

function getStorage() {
  let data = JSON.parse(localStorage.getItem("gym_data") || "{}");
  let master = JSON.parse(localStorage.getItem("gym_master") || "{}");
  
  if (!master["19-20"]) {
    master = {
      "19-20": [
        { nombre: "Manuel", monto: 1200 }, { nombre: "Irina", monto: 1200 }, { nombre: "Santi no", monto: 1200 },
        { nombre: "Lagarto", monto: 1200 }, { nombre: "Manuel chico", monto: 1200 }
      ],
      "10-11": [
        { nombre: "Casanova", monto: 2000 }, { nombre: "Fer", monto: 2500 }, { nombre: "Amigo 2", monto: 2500 },
        { nombre: "Lorenzo", monto: 2500 }, { nombre: "Niki", monto: 1200 }
      ],
      "20-21": [
        { nombre: "Guillermina", monto: 1200 }, { nombre: "Alejo", monto: 1200 }, { nombre: "Ayle", monto: 1200 },
        { nombre: "Juanma", monto: 1200 }, { nombre: "Alexander", monto: 1200 }, { nombre: "Cristian", monto: 2000 },
        { nombre: "Valentin", monto: 1200 }, { nombre: "Nataly", monto: 1200 }
      ],
      "21-22": [
        { nombre: "Soledad Madre", monto: 1200 }, { nombre: "Hija1", monto: 1200 }, { nombre: "Hija2", monto: 1200 },
        { nombre: "Amigo de Lucas", monto: 1200 }, { nombre: "Lucas", monto: 1200 }
      ]
    };
    localStorage.setItem("gym_master", JSON.stringify(master));
  }
  return { data, master };
}

function guardarStorage(data, master) {
  localStorage.setItem("gym_data", JSON.stringify(data));
  localStorage.setItem("gym_master", JSON.stringify(master));
}

function getMesAnterior(mes) {
  let [año, m] = mes.split("-");
  m = parseInt(m) - 1;
  if (m < 1) { m = 12; año = parseInt(año) - 1; }
  return año + "-" + String(m).padStart(2, "0");
}

function ensureMes(mes, master) {
  let { data } = getStorage();
  if (!data[mes]) {
    data[mes] = {};
    for (const horario of horarios) {
      data[mes][horario] = master[horario].map(a => ({ ...a, pago: false }));
    }
    localStorage.setItem("gym_data", JSON.stringify(data));
  }
  return data;
}

function calcularTotales(mes, data) {
  let dataMes = data[mes] || {};
  let total = 0, pagaron = 0, noPagan = 0;
  for (const horario of horarios) {
    if (dataMes[horario]) {
      for (const alumno of dataMes[horario]) {
        if (alumno.pago) { total += alumno.monto; pagaron++; } else { noPagan++; }
      }
    }
  }
  document.getElementById("total-mes").textContent = "$" + total.toLocaleString();
  document.getElementById("pagaron-mes").textContent = pagaron;
  document.getElementById("no-pagan-mes").textContent = noPagan;
  return total;
}

function dibujarGrafico() {
  let { data } = getStorage();
  let meses = Object.keys(data).sort().slice(-6);
  let container = document.getElementById("grafico-container");
  container.innerHTML = "";
  
  let maxTotal = 0;
  for (const mes of meses) {
    let total = calcularTotalesRaw(mes, data);
    if (total > maxTotal) maxTotal = total;
  }
  
  for (const mes of meses) {
    let total = calcularTotalesRaw(mes, data);
    let altura = maxTotal > 0 ? (total / maxTotal) * 150 : 0;
    let [año, m] = mes.split("-");
    let nomMes = ["Ene", "Feb", "Mar", "Abr", "May", "Jun", "Jul", "Ago", "Set", "Oct", "Nov", "Dic"][parseInt(m) - 1];
    
    let col = document.createElement("div");
    col.className = "grafico-col";
    col.innerHTML = `<div class="grafico-barra" style="height: ${altura}px;"></div><span class="grafico-label">${nomMes}</span><span class="grafico-valor">$${Math.round(total / 1000)}k</span>`;
    container.appendChild(col);
  }
}

function calcularTotalesRaw(mes, data) {
  let dataMes = data[mes] || {};
  let total = 0;
  for (const horario of horarios) {
    if (dataMes[horario]) {
      for (const alumno of dataMes[horario]) {
        if (alumno.pago) total += alumno.monto;
      }
    }
  }
  return total;
}

function renderizar(mes) {
  let { data, master } = getStorage();
  data = ensureMes(mes, master);
  let dataMes = data[mes];
  
  let container = document.getElementById("horarios-container");
  container.innerHTML = "";
  
  for (const horario of horarios) {
    let seccion = document.createElement("div");
    
    let header = document.createElement("div");
    header.className = "horario-header";
    header.textContent = etiquetas[horario];
    seccion.appendChild(header);
    
    let contenido = document.createElement("div");
    contenido.className = "horario-content";
    
    if (dataMes[horario].length === 0) {
      let vacio = document.createElement("p");
      vacio.className = "sin-alumnos";
      vacio.textContent = "Sin alumnos";
      contenido.appendChild(vacio);
    } else {
      for (let i = 0; i < dataMes[horario].length; i++) {
        let alumno = dataMes[horario][i];
        let fila = document.createElement("div");
        fila.className = "alumno-fila";
        
        let nombre = document.createElement("span");
        nombre.className = "alumno-nombre";
        nombre.textContent = alumno.nombre;
        nombre.onclick = () => {
          alumno.pago = !alumno.pago;
          localStorage.setItem("gym_data", JSON.stringify(data));
          renderizar(mes);
          calcularTotales(mes, data);
          dibujarGrafico();
        };
        
        let estado = document.createElement("span");
        estado.className = "alumno-estado " + (alumno.pago ? "estado-pagado" : "estado-nopagado");
        estado.textContent = (alumno.pago ? "✓ $" : "✗ ") + (alumno.pago ? alumno.monto : "NO PAGÓ");
        
        let btnDelete = document.createElement("button");
        btnDelete.className = "btn-delete";
        btnDelete.textContent = "✕";
        btnDelete.onclick = () => {
          master[horario] = master[horario].filter(a => a.nombre !== alumno.nombre);
          guardarStorage(data, master);
          renderizar(mes);
          calcularTotales(mes, data);
          dibujarGrafico();
        };
        
        fila.appendChild(nombre);
        fila.appendChild(estado);
        fila.appendChild(btnDelete);
        contenido.appendChild(fila);
      }
    }
    
    seccion.appendChild(contenido);
    container.appendChild(seccion);
  }
  
  calcularTotales(mes, data);
  dibujarGrafico();
}

let mesActual = "2026-08";
renderizar(mesActual);

document.getElementById("select-mes").onchange = (e) => {
  mesActual = e.target.value;
  renderizar(mesActual);
};

document.getElementById("btn-mes-ant").onclick = () => {
  mesActual = getMesAnterior(mesActual);
  document.getElementById("select-mes").value = mesActual;
  renderizar(mesActual);
};

document.getElementById("btn-mes-sig").onclick = () => {
  let [año, m] = mesActual.split("-");
  m = parseInt(m) + 1;
  if (m > 12) { m = 1; año = parseInt(año) + 1; }
  mesActual = año + "-" + String(m).padStart(2, "0");
  if (document.querySelector('#select-mes option[value="' + mesActual + '"]')) {
    document.getElementById("select-mes").value = mesActual;
  }
  renderizar(mesActual);
};

document.getElementById("btn-agregar").onclick = () => {
  document.getElementById("modal-agregar").style.display = "flex";
};

document.getElementById("btn-cancelar").onclick = () => {
  document.getElementById("modal-agregar").style.display = "none";
};

document.getElementById("btn-guardar").onclick = () => {
  let nombre = document.getElementById("input-nombre").value.trim();
  let horario = document.getElementById("select-horario").value;
  let monto = parseInt(document.getElementById("input-monto").value) || 0;
  
  if (!nombre) { alert("Ingresa el nombre"); return; }
  
  let { data, master } = getStorage();
  master[horario].push({ nombre, monto });
  guardarStorage(data, master);
  
  document.getElementById("input-nombre").value = "";
  document.getElementById("input-monto").value = "2000";
  document.getElementById("modal-agregar").style.display = "none";
  
  renderizar(mesActual);
};
  </script>
</body>
</html>
