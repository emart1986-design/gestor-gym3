<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sauce Boxeo">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/icon-192.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <title>Sauce Boxeo - Gestor de Gym</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; color: #1f2937; }
    .container { padding: 1rem; max-width: 100%; min-height: 100vh; }
    .header { background: white; border: 2px solid #000000; padding: 1rem 1.25rem; border-radius: 12px; color: #000000; margin-bottom: 1.5rem; display: flex; align-items: center; gap: 14px; }
    .header img { height: 46px; width: auto; flex-shrink: 0; }
    .header h1 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: 0.5px; }
    .header p { margin: 2px 0 0; font-size: 12px; color: #6b7280; }
    .mes-selector { background: white; border-radius: 12px; border: 0.5px solid #e5e7eb; padding: 1rem; margin-bottom: 1.5rem; display: flex; gap: 8px; align-items: center; }
    .mes-selector button { padding: 10px 14px; background: white; border: 0.5px solid #d1d5db; border-radius: 6px; font-size: 14px; cursor: pointer; color: #000000; font-weight: 600; }
    .mes-selector select { flex: 1; padding: 12px; border: 0.5px solid #d1d5db; border-radius: 6px; font-size: 16px; font-weight: 700; background: white; color: #000000; }
    .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 1.5rem; }
    .stat-card { background: white; border: 0.5px solid #e5e7eb; border-radius: 8px; padding: 1rem; text-align: center; }
    .stat-card p { margin: 0; font-size: 12px; }
    .stat-value { margin: 8px 0 0 !important; font-size: 26px; font-weight: 700; }
    .stat-total { color: #000000; }
    .stat-pagaron { color: #059669; }
    .stat-nopagan { color: #dc2626; }
    .stat-pendiente { color: #4b5563; }
    .buscador { width: 100%; padding: 12px; border: 0.5px solid #e5e7eb; border-radius: 8px; font-size: 15px; margin-bottom: 1rem; background: white; }
    .recordatorio { background: white; border: 2px solid #000000; border-radius: 8px; padding: 12px 14px; margin-bottom: 1.5rem; font-size: 13px; font-weight: 600; color: #000000; }
    .recordatorio b { color: #dc2626; }
    .btn-toggle { width: 100%; padding: 10px; background: white; border: 0.5px solid #d1d5db; border-radius: 8px; font-size: 13px; font-weight: 600; color: #000000; cursor: pointer; margin-bottom: 1rem; }
    .btn-toggle.activo { background: #000000; color: white; border-color: #000000; }
    .alumno-riesgo { background: #fef2f2; margin: 0 -1rem; padding-left: 1rem; padding-right: 1rem; }
    .acciones { display: flex; gap: 8px; margin-bottom: 1rem; flex-wrap: wrap; }
    .btn-accion { flex: 1 1 30%; padding: 10px 6px; background: white; border: 0.5px solid #d1d5db; border-radius: 8px; font-size: 12px; font-weight: 600; color: #000000; cursor: pointer; }
    .btn-edit { margin-left: 10px; background: #f0f0f0; border: none; color: #000000; cursor: pointer; font-size: 16px; font-weight: 700; width: 36px; height: 36px; border-radius: 6px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .btn-hist { margin-left: 10px; background: #f3f4f6; border: none; color: #000000; cursor: pointer; font-size: 15px; width: 36px; height: 36px; border-radius: 6px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .historial-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 0.5px solid #f3f4f6; font-size: 14px; }
    .historial-item:last-child { border-bottom: none; }
    .historial-pagado { color: #059669; font-weight: 700; }
    .historial-nopagado { color: #dc2626; font-weight: 700; }
    .historial-lista { max-height: 50vh; overflow-y: auto; }
    .grafico { background: white; border: 0.5px solid #e5e7eb; border-radius: 12px; padding: 1.5rem; margin-bottom: 1.5rem; }
    .grafico p { margin: 0 0 1rem; font-size: 14px; font-weight: 600; color: #000000; }
    .grafico-container { height: 160px; display: flex; align-items: flex-end; gap: 8px; border-bottom: 0.5px solid #e5e7eb; padding-bottom: 1rem; }
    .horarios { background: white; border-radius: 12px; border: 0.5px solid #e5e7eb; overflow: hidden; margin-bottom: 1.5rem; }
    .horario-header { background: #000000; color: white; padding: 1rem; font-size: 15px; font-weight: 600; }
    .horario-content { padding: 0.5rem 1rem; background: white; }
    .alumno-fila { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 0.5px solid #f3f4f6; }
    .alumno-fila:last-child { border-bottom: none; }
    .alumno-nombre { font-weight: 700; font-size: 17px; color: #000000; flex: 1; cursor: pointer; user-select: none; padding: 4px 0; }
    .alumno-estado { padding: 6px 10px; border-radius: 4px; font-size: 12px; font-weight: 700; white-space: nowrap; }
    .estado-pagado { background: #d1fae5; color: #059669; }
    .estado-nopagado { background: #fee2e2; color: #dc2626; }
    .btn-delete { margin-left: 10px; background: #dc2626; border: none; color: white; cursor: pointer; font-size: 16px; font-weight: 700; width: 36px; height: 36px; border-radius: 6px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .btn-agregar { width: 100%; padding: 14px 16px; background: #000000; border: none; border-radius: 8px; font-size: 16px; font-weight: 700; cursor: pointer; color: white; margin-bottom: 1rem; }
    .sin-alumnos { padding: 1rem 0; font-size: 13px; color: #9ca3af; }
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); z-index: 1000; align-items: flex-end; justify-content: center; }
    .modal-content { background: white; border-radius: 16px 16px 0 0; padding: 2rem; width: 100%; max-width: 500px; }
    .modal-content h2 { margin: 0 0 1.5rem; font-size: 20px; color: #000000; font-weight: 700; }
    .form-group { margin-bottom: 1rem; }
    .form-label { display: block; font-size: 13px; color: #6b7280; margin-bottom: 6px; font-weight: 600; }
    .form-input, .form-select { width: 100%; padding: 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 16px; box-sizing: border-box; }
    .modal-buttons { display: flex; gap: 10px; margin-top: 1.5rem; }
    .btn-cancelar { flex: 1; padding: 12px; background: white; border: 1px solid #d1d5db; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; color: #6b7280; }
    .btn-guardar { flex: 2; padding: 12px; background: #000000; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <img src="assets/logo.png" alt="Sauce Boxeo">
      <div>
        <h1>SAUCE BOXEO</h1>
        <p>Gestor de pagos</p>
      </div>
    </div>

    <div class="mes-selector">
      <button id="btn-mes-ant">←</button>
      <select id="select-mes"></select>
      <button id="btn-mes-sig">→</button>
    </div>

    <div class="recordatorio" id="recordatorio" style="display:none;"></div>

    <div class="stats">
      <div class="stat-card">
        <p style="color:#6b7280;">Total cobrado</p>
        <p class="stat-value stat-total" id="total-mes">$0</p>
      </div>
      <div class="stat-card">
        <p style="color:#4b5563;">Pendiente</p>
        <p class="stat-value stat-pendiente" id="pendiente-mes">$0</p>
      </div>
      <div class="stat-card">
        <p style="color:#059669;">Pagaron</p>
        <p class="stat-value stat-pagaron" id="pagaron-mes">0</p>
      </div>
      <div class="stat-card">
        <p style="color:#dc2626;">No pagan</p>
        <p class="stat-value stat-nopagan" id="no-pagan-mes">0</p>
      </div>
    </div>

    <div class="grafico">
      <p>Comparativa últimos meses</p>
      <div class="grafico-container" id="grafico-container"></div>
    </div>

    <div class="acciones">
      <button class="btn-accion" id="btn-horarios">🕐 Horarios</button>
      <button class="btn-accion" id="btn-exportar">⬇️ Exportar backup</button>
      <button class="btn-accion" id="btn-importar">⬆️ Importar backup</button>
      <input type="file" id="input-importar" accept="application/json" style="display:none;">
    </div>

    <input type="text" id="buscador" class="buscador" placeholder="🔍 Buscar alumno...">

    <button class="btn-toggle" id="btn-solo-pendientes">Ver solo pendientes</button>

    <div class="horarios" id="horarios-container"></div>

    <button class="btn-agregar" id="btn-agregar">+ Agregar alumno</button>
  </div>

  <div class="modal-overlay" id="modal-agregar">
    <div class="modal-content">
      <h2>Agregar alumno</h2>
      <div class="form-group">
        <label class="form-label">Nombre</label>
        <input type="text" class="form-input" id="input-nombre" placeholder="Nombre del alumno">
      </div>
      <div class="form-group">
        <label class="form-label">Horario</label>
        <select class="form-select" id="select-horario"></select>
      </div>
      <div class="form-group">
        <label class="form-label">Monto ($)</label>
        <input type="number" class="form-input" id="input-monto" value="2000">
      </div>
      <div class="modal-buttons">
        <button class="btn-cancelar" id="btn-cancelar">Cancelar</button>
        <button class="btn-guardar" id="btn-guardar">Guardar</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="modal-historial">
    <div class="modal-content">
      <h2>Historial de <span id="historial-nombre"></span></h2>
      <div class="historial-lista" id="historial-lista"></div>
      <div class="modal-buttons">
        <button class="btn-cancelar" id="btn-cerrar-historial">Cerrar</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="modal-horarios">
    <div class="modal-content">
      <h2>Horarios</h2>
      <div class="historial-lista" id="horarios-lista"></div>
      <div class="form-group" style="margin-top:1rem;">
        <label class="form-label">Nuevo horario (ej: 18 a 19)</label>
        <input type="text" class="form-input" id="input-nuevo-horario" placeholder="Ej: 18 a 19">
      </div>
      <div class="modal-buttons">
        <button class="btn-cancelar" id="btn-cerrar-horarios">Cerrar</button>
        <button class="btn-guardar" id="btn-agregar-horario">Agregar horario</button>
      </div>
    </div>
  </div>

  <script>
if ('serviceWorker' in navigator) navigator.serviceWorker.register('service-worker.js');

const mesesNombre = ["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Set","Oct","Nov","Dic"];

function getHorariosConfig() {
  let h = JSON.parse(localStorage.getItem("gym_horarios") || "null");
  if (!h) {
    h = [
      {id:"19-20", label:"19 a 20", activo:true},
      {id:"10-11", label:"10 a 11", activo:true},
      {id:"20-21", label:"20 a 21", activo:true},
      {id:"21-22", label:"21 a 22", activo:true}
    ];
    localStorage.setItem("gym_horarios", JSON.stringify(h));
  }
  return h;
}
function saveHorariosConfig(h) { localStorage.setItem("gym_horarios", JSON.stringify(h)); }

let horarios = [];
let etiquetas = {};
function cargarHorarios() {
  let config = getHorariosConfig();
  horarios = config.filter(h => h.activo !== false).map(h => h.id);
  etiquetas = {};
  for (const h of config) etiquetas[h.id] = "🕐 " + h.label;
}
cargarHorarios();

function getMaster() {
  let m = JSON.parse(localStorage.getItem("gym_master") || "null");
  if (!m) {
    m = {
      "19-20":[{nombre:"Manuel",monto:1200},{nombre:"Irina",monto:1200},{nombre:"Santi no",monto:1200},{nombre:"Lagarto",monto:1200},{nombre:"Manuel chico",monto:1200}],
      "10-11":[{nombre:"Casanova",monto:2000},{nombre:"Fer",monto:2500},{nombre:"Amigo 2",monto:2500},{nombre:"Lorenzo",monto:2500},{nombre:"Niki",monto:1200}],
      "20-21":[{nombre:"Guillermina",monto:1200},{nombre:"Alejo",monto:1200},{nombre:"Ayle",monto:1200},{nombre:"Juanma",monto:1200},{nombre:"Alexander",monto:1200},{nombre:"Cristian",monto:2000},{nombre:"Valentin",monto:1200},{nombre:"Nataly",monto:1200}],
      "21-22":[{nombre:"Soledad Madre",monto:1200},{nombre:"Hija1",monto:1200},{nombre:"Hija2",monto:1200},{nombre:"Amigo de Lucas",monto:1200},{nombre:"Lucas",monto:1200}]
    };
    localStorage.setItem("gym_master", JSON.stringify(m));
  }
  return m;
}

function getData() { return JSON.parse(localStorage.getItem("gym_data") || "{}"); }
function saveMaster(m) { localStorage.setItem("gym_master", JSON.stringify(m)); }
function saveData(d) { localStorage.setItem("gym_data", JSON.stringify(d)); }

function ensureMes(mes) {
  let data = getData();
  let master = getMaster();
  if (!data[mes]) {
    data[mes] = {};
    for (const h of horarios) {
      data[mes][h] = (master[h] || []).map(a => ({...a, pago: false}));
    }
    saveData(data);
  }
  return data;
}

function calcTotales(mes, data) {
  let dataMes = data[mes] || {};
  let total = 0, pagaron = 0, noPagan = 0, pendiente = 0;
  for (const h of Object.keys(dataMes)) {
    for (const a of (dataMes[h] || [])) {
      if (a.pago) { total += a.monto; pagaron++; } else { noPagan++; pendiente += a.monto; }
    }
  }
  document.getElementById("total-mes").textContent = "$" + total.toLocaleString();
  document.getElementById("pagaron-mes").textContent = pagaron;
  document.getElementById("no-pagan-mes").textContent = noPagan;
  document.getElementById("pendiente-mes").textContent = "$" + pendiente.toLocaleString();
}

function dibujarGrafico() {
  let data = getData();
  let meses = Object.keys(data).sort().slice(-6);
  let container = document.getElementById("grafico-container");
  container.innerHTML = "";
  let maxTotal = Math.max(...meses.map(m => totalRaw(m, data)), 1);
  for (const mes of meses) {
    let total = totalRaw(mes, data);
    let altura = Math.round((total / maxTotal) * 130);
    let [a, m] = mes.split("-");
    let col = document.createElement("div");
    col.style.cssText = "flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;";
    col.innerHTML = `<div style="width:100%;height:${altura}px;background:#000000;border-radius:4px 4px 0 0;min-height:4px;"></div><span style="font-size:11px;color:#6b7280;font-weight:600;">${mesesNombre[parseInt(m)-1]}</span><span style="font-size:10px;color:#6b7280;">$${Math.round(total/1000)}k</span>`;
    container.appendChild(col);
  }
}

function totalRaw(mes, data) {
  let total = 0;
  let dataMes = data[mes] || {};
  for (const h of Object.keys(dataMes)) for (const a of (dataMes[h] || [])) if (a.pago) total += a.monto;
  return total;
}

function estaEnRiesgo(data, mes, horario, nombre) {
  let meses = Object.keys(data).sort();
  let idx = meses.indexOf(mes);
  if (idx === -1) return false;
  let streak = 0;
  for (let i = idx; i >= 0; i--) {
    let arr = data[meses[i]][horario];
    if (!arr) break;
    let alumno = arr.find(a => a.nombre === nombre);
    if (!alumno) break;
    if (alumno.pago) break;
    streak++;
    if (streak >= 2) return true;
  }
  return false;
}

function renderizar(mes) {
  let data = ensureMes(mes);
  let dataMes = data[mes];
  let container = document.getElementById("horarios-container");
  container.innerHTML = "";
  let filtro = (document.getElementById("buscador").value || "").trim().toLowerCase();

  let idsAMostrar = [...horarios];
  for (const key of Object.keys(dataMes)) {
    if (!idsAMostrar.includes(key)) idsAMostrar.push(key);
  }

  for (const horario of idsAMostrar) {
    let seccion = document.createElement("div");
    let header = document.createElement("div");
    header.className = "horario-header";
    header.textContent = (etiquetas[horario] || ("🕐 " + horario)) + " (" + (dataMes[horario] || []).length + ")";
    seccion.appendChild(header);

    let contenido = document.createElement("div");
    contenido.className = "horario-content";

    let alumnos = (dataMes[horario] || [])
      .filter(a => a.nombre.toLowerCase().includes(filtro))
      .filter(a => !soloPendientes || !a.pago)
      .sort((a, b) => a.nombre.localeCompare(b.nombre, "es", { sensitivity: "base" }));
    if (alumnos.length === 0) {
      let msg = filtro ? "Sin resultados" : (soloPendientes ? "Todos pagaron ✓" : "Sin alumnos");
      contenido.innerHTML = '<p class="sin-alumnos">' + msg + '</p>';
    } else {
      for (let i = 0; i < alumnos.length; i++) {
        let alumno = alumnos[i];
        let fila = document.createElement("div");
        fila.className = "alumno-fila";
        if (!alumno.pago && estaEnRiesgo(data, mes, horario, alumno.nombre)) {
          fila.classList.add("alumno-riesgo");
        }

        let nombre = document.createElement("span");
        nombre.className = "alumno-nombre";
        nombre.textContent = (fila.classList.contains("alumno-riesgo") ? "⚠️ " : "") + alumno.nombre;
        if (fila.classList.contains("alumno-riesgo")) nombre.title = "No pagó los últimos 2 meses o más";
        nombre.onclick = () => {
          alumno.pago = !alumno.pago;
          alumno.fechaPago = alumno.pago ? new Date().toLocaleDateString("es-AR") : null;
          saveData(data);
          renderizar(mes);
          calcTotales(mes, getData());
          dibujarGrafico();
        };

        let estado = document.createElement("span");
        estado.className = "alumno-estado " + (alumno.pago ? "estado-pagado" : "estado-nopagado");
        estado.textContent = alumno.pago ? "✓ $" + alumno.monto : "✗ NO PAGÓ";
        if (alumno.pago && alumno.fechaPago) estado.title = "Pagó el " + alumno.fechaPago;

        let btnHist = document.createElement("button");
        btnHist.className = "btn-hist";
        btnHist.textContent = "🕘";
        btnHist.onclick = () => abrirHistorial(alumno.nombre);

        let btnEdit = document.createElement("button");
        btnEdit.className = "btn-edit";
        btnEdit.textContent = "✎";
        btnEdit.onclick = () => abrirModalEdicion(horario, alumno);

        let btnDel = document.createElement("button");
        btnDel.className = "btn-delete";
        btnDel.textContent = "✕";
        btnDel.onclick = () => {
          if (!confirm("¿Eliminar a " + alumno.nombre + " de este mes en adelante? Se conserva en los meses anteriores.")) return;

          let master = getMaster();
          master[horario] = master[horario].filter(a => a.nombre !== alumno.nombre);
          saveMaster(master);

          for (const key of Object.keys(data)) {
            if (key >= mes && data[key][horario]) {
              data[key][horario] = data[key][horario].filter(a => a.nombre !== alumno.nombre);
            }
          }
          saveData(data);
          renderizar(mes);
          calcTotales(mes, getData());
          dibujarGrafico();
        };

        fila.appendChild(nombre);
        fila.appendChild(estado);
        fila.appendChild(btnHist);
        fila.appendChild(btnEdit);
        fila.appendChild(btnDel);
        contenido.appendChild(fila);
      }
    }
    seccion.appendChild(contenido);
    container.appendChild(seccion);
  }

  calcTotales(mes, data);
  dibujarGrafico();
  mostrarRecordatorio();
}

function mesActualReal() {
  let d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
}

function mostrarRecordatorio() {
  let el = document.getElementById("recordatorio");
  let hoy = new Date();
  let ultimoDia = new Date(hoy.getFullYear(), hoy.getMonth() + 1, 0).getDate();
  let diasRestantes = ultimoDia - hoy.getDate();

  if (mesActual !== mesActualReal() || diasRestantes > 7) {
    el.style.display = "none";
    return;
  }

  let dataMes = getData()[mesActual] || {};
  let noPagaron = 0, pendiente = 0;
  for (const h of Object.keys(dataMes)) {
    for (const a of (dataMes[h] || [])) {
      if (!a.pago) { noPagaron++; pendiente += a.monto; }
    }
  }

  if (noPagaron === 0) {
    el.style.display = "none";
    return;
  }

  el.style.display = "block";
  el.innerHTML = "⚠️ Quedan <b>" + diasRestantes + " día" + (diasRestantes === 1 ? "" : "s") + "</b> del mes y <b>" +
    noPagaron + " alumno" + (noPagaron === 1 ? "" : "s") + "</b> sin pagar ($" + pendiente.toLocaleString() + " pendientes)";
}

function generarOpcionesMes() {
  let mesesExistentes = Object.keys(getData());
  let hoy = new Date();
  let cursor = new Date(hoy.getFullYear(), hoy.getMonth() - 12, 1);
  let fin = new Date(hoy.getFullYear(), hoy.getMonth() + 12, 1);
  let mesesSet = new Set();
  while (cursor <= fin) {
    mesesSet.add(cursor.getFullYear() + "-" + String(cursor.getMonth() + 1).padStart(2, "0"));
    cursor.setMonth(cursor.getMonth() + 1);
  }
  for (const m of mesesExistentes) mesesSet.add(m);

  let select = document.getElementById("select-mes");
  let valorPrevio = select.value;
  select.innerHTML = "";
  for (const m of [...mesesSet].sort()) {
    let [anio, mes] = m.split("-");
    let opt = document.createElement("option");
    opt.value = m;
    opt.textContent = mesesNombre[parseInt(mes) - 1] + " " + anio;
    select.appendChild(opt);
  }
  if (valorPrevio && [...select.options].some(o => o.value === valorPrevio)) select.value = valorPrevio;
}

function refrescarSelectHorario() {
  let select = document.getElementById("select-horario");
  select.innerHTML = "";
  for (const id of horarios) {
    let opt = document.createElement("option");
    opt.value = id;
    opt.textContent = etiquetas[id].replace("🕐 ", "");
    select.appendChild(opt);
  }
}

function renderizarListaHorarios() {
  let config = getHorariosConfig().filter(h => h.activo !== false);
  let lista = document.getElementById("horarios-lista");
  lista.innerHTML = "";
  for (const h of config) {
    let item = document.createElement("div");
    item.className = "historial-item";
    let span = document.createElement("span");
    span.textContent = h.label;
    let btn = document.createElement("button");
    btn.className = "btn-delete";
    btn.style.cssText = "width:30px;height:30px;font-size:13px;";
    btn.textContent = "✕";
    btn.onclick = () => {
      if (config.length <= 1) { alert("Debe quedar al menos un horario activo"); return; }
      if (!confirm("¿Eliminar el horario \"" + h.label + "\"? Los alumnos ya cargados en meses anteriores se conservan; no se van a poder agregar mas alumnos a este horario de ahora en mas.")) return;
      let todos = getHorariosConfig();
      let idx = todos.findIndex(x => x.id === h.id);
      todos[idx].activo = false;
      saveHorariosConfig(todos);
      cargarHorarios();
      refrescarSelectHorario();
      renderizarListaHorarios();
      renderizar(mesActual);
    };
    item.appendChild(span);
    item.appendChild(btn);
    lista.appendChild(item);
  }
}

let editando = null;
let soloPendientes = false;

function abrirModalEdicion(horario, alumno) {
  editando = { horario, nombre: alumno.nombre };
  document.querySelector("#modal-agregar h2").textContent = "Editar alumno";
  document.getElementById("btn-guardar").textContent = "Guardar cambios";
  document.getElementById("input-nombre").value = alumno.nombre;
  refrescarSelectHorario();
  let select = document.getElementById("select-horario");
  if (![...select.options].some(o => o.value === horario)) {
    let opt = document.createElement("option");
    opt.value = horario;
    opt.textContent = (etiquetas[horario] || horario).replace("🕐 ", "") + " (inactivo)";
    select.insertBefore(opt, select.firstChild);
  }
  select.value = horario;
  document.getElementById("input-monto").value = alumno.monto;
  document.getElementById("modal-agregar").style.display = "flex";
  document.getElementById("input-nombre").focus();
}

function cerrarModal() {
  editando = null;
  document.querySelector("#modal-agregar h2").textContent = "Agregar alumno";
  document.getElementById("btn-guardar").textContent = "Guardar";
  document.getElementById("input-nombre").value = "";
  document.getElementById("input-monto").value = "2000";
  document.getElementById("modal-agregar").style.display = "none";
}

function abrirHistorial(nombre) {
  let data = getData();
  let lista = document.getElementById("historial-lista");
  lista.innerHTML = "";
  let hayRegistros = false;

  for (const mes of Object.keys(data).sort()) {
    for (const h of horarios) {
      let alumno = (data[mes][h] || []).find(a => a.nombre === nombre);
      if (!alumno) continue;
      hayRegistros = true;
      let [anio, mm] = mes.split("-");
      let item = document.createElement("div");
      item.className = "historial-item";
      let estadoTxt = alumno.pago
        ? "✓ $" + alumno.monto + (alumno.fechaPago ? " · " + alumno.fechaPago : "")
        : "✗ No pagó";
      item.innerHTML = "<span>" + mesesNombre[parseInt(mm)-1] + " " + anio + "</span><span class=\"" +
        (alumno.pago ? "historial-pagado" : "historial-nopagado") + "\">" + estadoTxt + "</span>";
      lista.appendChild(item);
    }
  }

  if (!hayRegistros) lista.innerHTML = '<p class="sin-alumnos">Sin registros</p>';
  document.getElementById("historial-nombre").textContent = nombre;
  document.getElementById("modal-historial").style.display = "flex";
}

document.getElementById("btn-cerrar-historial").onclick = () => {
  document.getElementById("modal-historial").style.display = "none";
};

document.getElementById("btn-horarios").onclick = () => {
  renderizarListaHorarios();
  document.getElementById("input-nuevo-horario").value = "";
  document.getElementById("modal-horarios").style.display = "flex";
};

document.getElementById("btn-cerrar-horarios").onclick = () => {
  document.getElementById("modal-horarios").style.display = "none";
};

document.getElementById("btn-agregar-horario").onclick = () => {
  let label = document.getElementById("input-nuevo-horario").value.trim();
  if (!label) { alert("Ingresa un horario"); return; }
  let config = getHorariosConfig();
  let id = "h" + Date.now();
  config.push({ id, label, activo: true });
  saveHorariosConfig(config);

  let master = getMaster();
  master[id] = [];
  saveMaster(master);

  cargarHorarios();
  refrescarSelectHorario();
  renderizarListaHorarios();
  document.getElementById("input-nuevo-horario").value = "";
  renderizar(mesActual);
};

refrescarSelectHorario();
generarOpcionesMes();
let mesActual = mesActualReal();
if (![...document.getElementById("select-mes").options].some(o => o.value === mesActual)) {
  mesActual = document.getElementById("select-mes").options[0].value;
}
document.getElementById("select-mes").value = mesActual;
renderizar(mesActual);

document.getElementById("select-mes").onchange = e => { mesActual = e.target.value; renderizar(mesActual); };

document.getElementById("btn-mes-ant").onclick = () => {
  let opts = [...document.getElementById("select-mes").options];
  let idx = opts.findIndex(o => o.value === mesActual);
  if (idx > 0) { mesActual = opts[idx-1].value; document.getElementById("select-mes").value = mesActual; renderizar(mesActual); }
};

document.getElementById("btn-mes-sig").onclick = () => {
  let opts = [...document.getElementById("select-mes").options];
  let idx = opts.findIndex(o => o.value === mesActual);
  if (idx < opts.length-1) { mesActual = opts[idx+1].value; document.getElementById("select-mes").value = mesActual; renderizar(mesActual); }
};

document.getElementById("buscador").oninput = () => renderizar(mesActual);

document.getElementById("btn-solo-pendientes").onclick = () => {
  soloPendientes = !soloPendientes;
  document.getElementById("btn-solo-pendientes").classList.toggle("activo", soloPendientes);
  document.getElementById("btn-solo-pendientes").textContent = soloPendientes ? "✓ Viendo solo pendientes" : "Ver solo pendientes";
  renderizar(mesActual);
};

document.getElementById("btn-agregar").onclick = () => {
  editando = null;
  document.querySelector("#modal-agregar h2").textContent = "Agregar alumno";
  document.getElementById("btn-guardar").textContent = "Guardar";
  document.getElementById("input-nombre").value = "";
  document.getElementById("input-monto").value = "2000";
  refrescarSelectHorario();
  document.getElementById("select-horario").value = horarios[0];
  document.getElementById("modal-agregar").style.display = "flex";
  document.getElementById("input-nombre").focus();
};

document.getElementById("btn-cancelar").onclick = cerrarModal;

document.getElementById("btn-guardar").onclick = () => {
  let nombre = document.getElementById("input-nombre").value.trim();
  let horario = document.getElementById("select-horario").value;
  let monto = parseInt(document.getElementById("input-monto").value) || 0;

  if (!nombre) { alert("Ingresa el nombre"); return; }

  let master = getMaster();
  let data = getData();

  let duplicado = (master[horario] || []).some(a =>
    a.nombre.trim().toLowerCase() === nombre.trim().toLowerCase() &&
    !(editando && editando.horario === horario && editando.nombre === a.nombre)
  );
  if (duplicado) { alert("Ya hay un alumno con ese nombre en ese horario"); return; }

  if (editando) {
    let idxMaster = (master[editando.horario] || []).findIndex(a => a.nombre === editando.nombre);
    if (idxMaster !== -1) master[editando.horario].splice(idxMaster, 1);
    if (!master[horario]) master[horario] = [];
    master[horario].push({ nombre, monto });
    saveMaster(master);

    for (const key of Object.keys(data)) {
      if (key <= mesActual) continue;
      let arr = data[key][editando.horario];
      if (!arr) continue;
      let idx = arr.findIndex(a => a.nombre === editando.nombre);
      if (idx === -1) continue;
      if (horario === editando.horario) {
        arr[idx].nombre = nombre;
        arr[idx].monto = monto;
      } else {
        let pago = arr[idx].pago;
        arr.splice(idx, 1);
        if (!data[key][horario]) data[key][horario] = [];
        data[key][horario].push({ nombre, monto, pago });
      }
    }
    saveData(data);
  } else {
    if (!master[horario]) master[horario] = [];
    master[horario].push({nombre, monto});
    saveMaster(master);

    if (!data[mesActual]) data[mesActual] = {};
    if (!data[mesActual][horario]) data[mesActual][horario] = [];
    data[mesActual][horario].push({nombre, monto, pago: false});

    for (const key of Object.keys(data)) {
      if (key > mesActual && data[key][horario] && !data[key][horario].some(a => a.nombre === nombre)) {
        data[key][horario].push({nombre, monto, pago: false});
      }
    }
    saveData(data);
  }

  cerrarModal();
  generarOpcionesMes();
  renderizar(mesActual);
};

document.getElementById("btn-exportar").onclick = () => {
  let backup = { master: getMaster(), data: getData(), exportado: new Date().toISOString() };
  let blob = new Blob([JSON.stringify(backup, null, 2)], { type: "application/json" });
  let url = URL.createObjectURL(blob);
  let a = document.createElement("a");
  a.href = url;
  a.download = "gestor-gym-backup-" + mesActualReal() + ".json";
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
};

document.getElementById("btn-importar").onclick = () => {
  document.getElementById("input-importar").click();
};

document.getElementById("input-importar").onchange = e => {
  let file = e.target.files[0];
  e.target.value = "";
  if (!file) return;
  let reader = new FileReader();
  reader.onload = () => {
    let backup;
    try {
      backup = JSON.parse(reader.result);
    } catch (err) {
      alert("El archivo no es un backup valido");
      return;
    }
    if (!backup || typeof backup.master !== "object" || typeof backup.data !== "object") {
      alert("El archivo no es un backup valido");
      return;
    }
    if (!confirm("Esto reemplaza todos los datos actuales por los del archivo. ¿Continuar?")) return;
    saveMaster(backup.master);
    saveData(backup.data);
    generarOpcionesMes();
    if ([...document.getElementById("select-mes").options].some(o => o.value === mesActual)) {
      document.getElementById("select-mes").value = mesActual;
    } else {
      mesActual = document.getElementById("select-mes").options[0].value;
      document.getElementById("select-mes").value = mesActual;
    }
    renderizar(mesActual);
    alert("Datos importados correctamente");
  };
  reader.readAsText(file);
};
  </script>
</body>
